{% extends "dashboard/layout.html" %}
{% block dash %}
<div class="d-flex justify-content-between mb-3">
  <h5 class="mb-0">Danh mục linh kiện</h5>
  <a class="btn btn-danger" href="{% url 'dashboard:category_create' %}">+ Thêm danh mục</a>
</div>
<table class="table bg-white align-middle">
  <thead><tr><th>Tên</th><th>Slug</th><th>Mô tả</th><th>Số sản phẩm</th><th></th></tr></thead>
  <tbody>
  {% for c in categories %}
  <tr><td>{{ c.name }}</td><td>{{ c.slug }}</td><td>{{ c.description|truncatechars:60 }}</td><td>{{ c.product_count }}</td>
    <td class="text-nowrap">
      <a class="btn btn-sm btn-outline-dark" href="{% url 'dashboard:category_update' c.pk %}">Sửa</a>
      <form method="post" action="{% url 'dashboard:category_delete' c.pk %}" class="d-inline" onsubmit="return confirm('Xóa danh mục này?');">{% csrf_token %}
        <button class="btn btn-sm btn-outline-danger">Xóa</button></form>
    </td></tr>
  {% empty %}<tr><td colspan="5" class="text-center text-muted">Chưa có danh mục.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
