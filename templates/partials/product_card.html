{% load shop_extras %}
<div class="col-6 col-md-4 col-lg-3">
  <div class="card h-100 product-card shadow-sm">
    <a href="{{ p.get_absolute_url }}"><img src="{{ p.image_src }}" class="card-img-top" alt="{{ p.name }}"></a>
    <div class="card-body d-flex flex-column">
      <div class="small text-muted">{{ p.category.name }} · {{ p.brand }}</div>
      <h6 class="card-title"><a class="text-decoration-none text-dark" href="{{ p.get_absolute_url }}">{{ p.name }}</a></h6>
      <div class="price mb-1">{{ p.price|vnd }}</div>
      {% if p.in_stock %}<span class="badge bg-success align-self-start mb-2">Còn hàng ({{ p.stock }})</span>
      {% else %}<span class="badge bg-secondary align-self-start mb-2">Hết hàng</span>{% endif %}
      <form method="post" action="{% url 'orders:cart_add' %}" class="mt-auto">{% csrf_token %}
        <input type="hidden" name="product_id" value="{{ p.pk }}">
        <input type="hidden" name="quantity" value="1">
        <button class="btn btn-sm btn-danger w-100" {% if not p.in_stock %}disabled{% endif %}>Thêm vào giỏ</button>
      </form>
    </div>
  </div>
</div>
