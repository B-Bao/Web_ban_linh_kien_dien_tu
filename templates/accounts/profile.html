{% extends "base.html" %}
{% block title %}Thông tin cá nhân · PCShop{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Thông tin cá nhân</h4>
    <p class="text-muted small">Tên đăng nhập: <strong>{{ user.username }}</strong> · Vai trò: {{ user.get_role_display }}</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button class="btn btn-danger">Lưu thay đổi</button>
      <a class="btn btn-outline-secondary" href="{% url 'orders:list' %}">Đơn hàng của tôi</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
